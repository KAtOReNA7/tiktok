<metadata>Local SVG assembly of exact Figma V3 exported PNG layers; not a native Figma SVG export. Fixed geometry remains in spec/cover_delivery.json. Precise final title is rendered from cover_job.json with the bundled NotoSansSC-Black.otf, not these empty authoring text nodes.</metadata>
<defs><clipPath id="story-window"><rect x="160" y="16" width="744" height="1008"/></clipPath></defs>
